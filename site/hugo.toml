# cppgo documentation site.
#
# No external theme, no Hugo modules, no git submodules: every layout and every
# stylesheet in this directory is hand-written, so `hugo --minify --gc` needs no
# network access at all.
#
# The site is published as GitHub project pages, so every internal link goes
# through Hugo's relURL/ref helpers and keeps the /cppgo/ subpath.

baseURL = "https://manu343726.github.io/cppgo/"
title = "cppgo"
locale = "en-US"
defaultContentLanguage = "en"
enableRobotsTXT = true
# A removed or renamed page must not leave its old HTML behind: publishing a
# stale copy is worse than a 404.
cleanDestinationDir = true
disableKinds = ["taxonomy", "term"]

[params]
  description = "Call C++ from Go without cgo, without import \"C\", and without paying the cgo tax on every call."
  tagline = "Call C++ from Go with no cgo."
  github = "https://github.com/Manu343726/cppgo"
  releases = "https://github.com/Manu343726/cppgo/releases"
  pkg = "https://pkg.go.dev/github.com/Manu343726/cppgo"
  license = "MIT"
  author = "Manu Sánchez"
  goVersion = "1.25"
  abi = "System V AMD64 ABI"
  platform = "Linux/amd64"

[markup]
  [markup.highlight]
    style = "monokai"
    noClasses = true
    guessSyntax = false
    lineNumbersInTable = false
    tabWidth = 4

  [markup.goldmark.renderer]
    hardWraps = false
    # The callout boxes are plain <div>s in the page source. The content is
    # hand-written and local; there is no user-generated HTML on this site.
    unsafe = true

  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

[outputs]
  home = ["HTML"]
  section = ["HTML"]
  page = ["HTML"]

[minify]
  [minify.tdewolff.html]
    keepWhitespace = false
