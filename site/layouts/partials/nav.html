<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="{{ site.Home.RelPermalink }}">
      <span class="brand-mark">cpp<span class="brand-go">go</span></span>
      <span class="brand-sub">no cgo</span>
    </a>
    <nav class="topnav" aria-label="Main">
      {{- range site.Sections.ByWeight }}
      <a href="{{ .RelPermalink }}"{{ if eq $.Section .Section }} class="active"{{ end }}>{{ .Title }}</a>
      {{- end }}
      <span class="topnav-sep" aria-hidden="true"></span>
      <a href="{{ site.Params.github }}" rel="noopener">GitHub</a>
      <a href="{{ site.Params.releases }}" rel="noopener">Releases</a>
      <a href="{{ site.Params.pkg }}" rel="noopener">pkg.go.dev</a>
    </nav>
  </div>
</header>
