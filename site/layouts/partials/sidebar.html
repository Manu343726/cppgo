{{- $current := . -}}
<aside class="sidebar">
  <nav aria-label="Contents">
    {{- range site.Sections.ByWeight }}
    {{- $section := . }}
    <p class="sidebar-heading"><a href="{{ $section.RelPermalink }}"{{ if eq $current.Permalink $section.Permalink }} class="active"{{ end }}>{{ $section.Title }}</a></p>
    <ul class="sidebar-list">
      {{- range $section.RegularPages.ByWeight }}
      <li><a href="{{ .RelPermalink }}"{{ if eq .Permalink $current.Permalink }} class="active" aria-current="page"{{ end }}>{{ .Title }}</a></li>
      {{- end }}
    </ul>
    {{- end }}
    <p class="sidebar-heading">Links</p>
    <ul class="sidebar-list">
      <li><a href="{{ site.Params.github }}" rel="noopener">Source on GitHub</a></li>
      <li><a href="{{ site.Params.releases }}" rel="noopener">Releases</a></li>
      <li><a href="{{ site.Params.pkg }}" rel="noopener">Go API reference</a></li>
    </ul>
  </nav>
</aside>
