{{ define "main" }}
<article class="page">
  <header class="page-header">
    <p class="eyebrow">404</p>
    <h1>Not found</h1>
    <p class="lede">That page does not exist. The documentation index is the fastest way back.</p>
  </header>
  <div class="prose">
    <p>
      Nothing lives at this URL. Try <a href="{{ "docs/" | relURL }}">the documentation</a>,
      <a href="{{ "tutorials/" | relURL }}">the tutorials</a>, or
      <a href="{{ site.Home.RelPermalink }}">the home page</a>.
    </p>
  </div>
</article>
{{ end }}
