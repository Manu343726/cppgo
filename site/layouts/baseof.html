<!DOCTYPE html>
<html lang="{{ site.Language.Locale | default "en" }}">
<head>
{{ partial "head.html" . }}
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
{{ partial "nav.html" . }}
<div class="shell{{ if not .IsHome }} with-sidebar{{ end }}">
  {{- if not .IsHome }}{{ partial "sidebar.html" . }}{{ end }}
  <main id="main" class="content">
    {{- block "main" . }}{{ end }}
  </main>
</div>
{{ partial "footer.html" . }}
</body>
</html>
