name: CI

# The gate, run inside the image this repository's Dockerfile produces.
#
# Why an image at all: CI used to inherit its toolchain from `ubuntu-latest`, and when that
# image stopped shipping libclang, internal/cxx silently skipped itself, its coverage vanished
# and the 99% gate failed for a reason that had nothing to do with the code. The Dockerfile
# pins Go, g++ 14, clang/libclang 22, golangci-lint, hugo, binutils and make instead, so the
# environment is a reviewed artefact. It also carries the target libraries #15's tests bind
# against the real thing and not a mock — Eigen 3.4.0 and OpenCV 4.10.0 from trixie's archive,
# ArrayFire 3.10.0 (CPU backend) built from source because the archive has no package for it;
# the provenance of each and the build-time compile/link/run check are in the `Dockerfile`.
#
# ---------------------------------------------------------------------------
# THE TWO FACTS THIS FILE OWNS. Every other mention of them, here and in the pull request,
# points back to this block.
# ---------------------------------------------------------------------------
# 1. THE IMAGE AND ITS TAG.
#
#      registry.docker.manu343726.com/homelab/cppgo-ci:<recipe>
#
#    `<recipe>` is the 7-character short sha of the commit that last touched `Dockerfile`:
#
#        git log -1 --format=%h -- Dockerfile     # 1914e8c, for the recipe this file names
#
#    The tag is the recipe's address, so a green run can be re-read months later and describe
#    the same environment. It is immutable: a published tag is never rebuilt over, because a
#    run that reported on one environment cannot be told apart from a run on the next. A
#    changed recipe gets a new tag (the new commit's sha), built, run, and only then used here.
#    `latest` exists beside it for humans reading the registry; no workflow may run in it.
#
#    The image is published by hand today, and the tag below names the last build that was
#    pushed: it was built from this repository's `Dockerfile` when the recipe moved to clang 22
#    (trixie's archive stops at 19 and the tree binds `clang_getOffsetOfBase`; the reason and
#    the measured choice of major are in the `Dockerfile`'s base note, which owns them) and
#    gained the target libraries. Its index digest is
#    `sha256:42e52d97eb251d7fc608ac41d08aacdc60bd8acfa64627b24f13bca0941cefce`.
#
#    Publishing on a `Dockerfile` change is not automated yet: a change lands in
#    `.forgejo/workflows/image.yml` on the day it does, and this block gains one link to it.
#    Until then, a recipe change means: build, push under the new recipe tag, run this workflow
#    in it, and only then point the line below at it.
#
# 2. THE RUNNER LABEL.
#
#      runs-on: [docker, homelab]
#
#    The instance has two runners, both registered at instance level (`owner_id 0`,
#    `repo_id 0`): `forgejo-runner-108` on VM 108, labels `docker` + `homelab`, and
#    `forgejo-runner-pcgordo` in PCGORDO's WSL, labels `docker` + `wsl`. `ubuntu-latest` —
#    what this workflow asked for while it was GitHub's — is a label no runner declares, and a
#    job whose `runs-on` nothing serves is never assigned: it waits until
#    `[actions] ABANDONED_JOB_TIMEOUT` cancels it. That is the whole of runs #664–#676.
#
#    `[docker, homelab]` is an intersection, so it pins every job to VM 108. The reason is
#    measured, not assumed: that is the only host where the pull of this private Harbor
#    project's image was proven (`docker pull …:1914e8c`, then `docker run --rm … go version`),
#    and the gate must not depend on which host the scheduler happens to pick. The cost is
#    capacity 1 on that runner, so this file's two jobs run one after the other. Lifting the
#    pin to `runs-on: docker` is a one-line change on the day a job is measured green on the
#    other host.
#
# ---------------------------------------------------------------------------
# Why this file is here and not in `.github/workflows/`.
#
# Forgejo reads exactly one workflow directory: the first that exists among `.forgejo/workflows`,
# `.gitea/workflows` and `.github/workflows` (`modules/actions/workflows.go`, `ListWorkflows`).
# With this directory present, Forgejo runs exactly the files in it and stops reading
# `.github/workflows/` — so `.github/workflows/ci.yml` stays as GitHub's copy of the same gate,
# and the two copies never both run on one forge.
#
# The pull credential is a repository secret, read at run time and never written into the image,
# a layer, a build argument or this file:
#
#   REGISTRY_USER   `robot$homelab+ci`
#   REGISTRY_TOKEN  that robot's password
#
# The pair is the same one `manu343726/z80-emulator` uses for the same robot on this instance, so
# one registry has one set of names. A missing secret fails the pull with
# `failed to handle credentials: username is empty`, which is a configuration answer and not a
# defect in the tree.
#
# Node.js: this image deliberately carries none, and that has a consequence which is written
# here once. Every `uses:` is a JavaScript action that the runner executes with the *container's*
# `node`; run #677 measured what that means for this image — `actions/checkout@v4` died in 6 s
# with `exec: "node": executable file not found in $PATH`. So nothing here uses an action: the
# checkout is the `git fetch` in each job, and `actions/upload-artifact` is unavailable, which
# means `coverage.out` is **not** attached to the run. What a later reader gets instead:
#
#   * the coverage gate's own `PASS/FAIL` line, the per-package table and the whole
#     `coverage-gate.sh` report are in the `Coverage gate (>= 99%)` step's log, kept with the
#     run for as long as the instance keeps its task logs;
#   * the same number is restated in `$GITHUB_STEP_SUMMARY` (Forgejo 17 persists and renders it)
#     by the last step of `test`, so the run's headline survives the log;
#   * benchmarks are not run here — `make bench` is a record, not a gate.
#
# A JUnit XML is not produced by `go test` without a reporter neither image nor runner has
# today, so no step invents one. The image could carry Node.js and both would come back; that is
# a `Dockerfile` change and a new recipe tag, not a workflow one, and it is not made here.
#
# The gates below are the repository's: `CGO_ENABLED=0 go build`, `go vet`, `golangci-lint`,
# `make fmt-check`, the two test passes (`CGO_ENABLED=0`, then `-race` with atomic coverage), the
# coverage gate at 99.0% and the examples build. Nothing here weakens a Makefile target or the
# threshold, and the suite is the same one `.github/workflows/ci.yml` runs.
#
# The order of the steps is a reporting decision and not a gate decision. The two test passes
# and the coverage gate run **before** `golangci-lint`, because lint is red on `main` today
# (issue #18: 27 `misspell` and 1 `unused` under the config the repository ships) and a style
# finding in the fourth step otherwise hides whether the suite and the number are green. Every
# gate keeps its own failure: the job still fails at the first step that fails, whichever it is.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main]
    paths-ignore:
      - 'site/**'
      - '**/*.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COVERAGE_THRESHOLD: '99.0'
  # A skipped introspection test is a lie in CI: it silently drops most of internal/cxx from the
  # coverage profile and the gate then fails with a number nobody can explain. Require libclang
  # instead of skipping.
  CPPGO_REQUIRE_LIBCLANG: '1'
  CI_IMAGE: registry.docker.manu343726.com/homelab/cppgo-ci:3610540

jobs:
  test:
    name: test
    runs-on: [docker, homelab]
    # The runner's ceiling is 5h; this is the job's own, well inside it. A job killed by its own
    # `timeout-minutes` reports as the step that hung, which is the report a reader can act on.
    timeout-minutes: 90
    container:
      # The literal and not `${{ env.CI_IMAGE }}`: the `env` context is not available to
      # `container.image` (GitHub's own table of contexts omits it), and the Forgejo runner's
      # evaluation of it there is unmeasured. The rule the literal follows is stated once, in
      # the header; `CI_IMAGE` in the workflow `env` is the summary's copy of the same string.
      image: registry.docker.manu343726.com/homelab/cppgo-ci:3610540
      credentials:
        username: ${{ secrets.REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - name: Checkout
        # `actions/checkout` is a JavaScript action (`node dist/index.js`) and this image carries
        # no Node.js: the runner executed it and died with `exec: "node": executable file not
        # found in $PATH` (run #677, job `test`, 2026-11-08, 6 s). Rather than add a runtime to
        # the image that the suite does not use, the clone is done with the image's own git.
        #
        # `GITHUB_REF` is the ref under test — `refs/pull/16/head` for a pull request,
        # `refs/heads/<branch>` for a push — so this fetches the same tree `actions/checkout`
        # would. The job token reaches git through a credential helper and never through a URL,
        # because git prints a failing URL, and a printed token is a leaked token.
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -c credential.helper='!f() { echo username=x-access-token; echo "password=${TOKEN}"; }; f' \
            fetch --depth=1 origin "${GITHUB_REF}"
          git checkout -q --detach FETCH_HEAD
          git --no-pager log --oneline -1

      - name: Show the pinned toolchain
        # The evidence that the gates below ran in the image and not on a runner's host: these
        # versions are the Dockerfile's ARGs, read out of the container.
        run: |
          go version
          g++ --version | head -n 1
          clang --version | head -n 1
          golangci-lint --version
          hugo version
          nm --version | head -n 1

      - name: Build without cgo (the no-cgo contract)
        run: CGO_ENABLED=0 go build ./...

      - name: go vet
        run: go vet ./...

      - name: gofmt (make fmt-check)
        run: make fmt-check

      - name: Test without cgo (proves the library needs no cgo)
        run: CGO_ENABLED=0 go test -count=1 ./...

      - name: Test (race + atomic coverage)
        run: |
          go test -race -count=1 -covermode=atomic \
            -coverprofile=coverage.out ./...

      - name: Coverage gate (>= 99%)
        # `tee` keeps the gate's own output for the summary below; the pipeline still fails the
        # step because the runner's shell is `bash -e -o pipefail`.
        run: ./scripts/coverage-gate.sh coverage.out "${COVERAGE_THRESHOLD}" | tee coverage-gate.txt

      - name: Build the examples
        run: ./scripts/build-examples.sh

      - name: golangci-lint
        # Last on purpose: the suite and the coverage number are the report a reader needs, and
        # a style finding must not be able to hide them. It is still a gate — the job fails here
        # like anywhere else.
        run: golangci-lint run --timeout=8m

      - name: The run's report
        # Forgejo 17 persists `$GITHUB_STEP_SUMMARY` and renders it above the job's log, so this is
        # where the number a later reader needs lives. It restates the gate's own line rather than
        # recomputing a percentage of its own.
        if: always()
        continue-on-error: true
        run: |
          {
            echo "## cppgo — test"
            echo
            echo "- image: \`${CI_IMAGE}\`"
            echo "- commit: \`$(git rev-parse HEAD)\`"
            echo "- toolchain: $(go version), $(clang --version | head -n 1)"
            if [ -s coverage-gate.txt ]; then
              echo "- coverage gate: $(sed -e 's/\x1b\[[0-9;]*m//g' coverage-gate.txt | grep -E '^(PASS|FAIL)' | tail -n 1)"
            else
              echo "- coverage gate: no output (the profile was not produced, or the gate did not run)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build-latest-go:
    name: build with the latest Go
    # Forward-compatibility smoke test only: no coverage, no libclang. It answers one question —
    # does the library still compile with a Go newer than the one the image pins? — so a
    # toolchain bump is never a surprise.
    #
    # GitHub's copy of this gate uses `actions/setup-go`. Here the toolchain is fetched with curl
    # from go.dev into `/tmp`, which is the same question asked without a third-party action and
    # without a second environment: the job still runs in the pinned image, so the compiler's
    # host and its C++ side are the ones under test.
    runs-on: [docker, homelab]
    timeout-minutes: 30
    container:
      # The literal and not `${{ env.CI_IMAGE }}`: the `env` context is not available to
      # `container.image` (GitHub's own table of contexts omits it), and the Forgejo runner's
      # evaluation of it there is unmeasured. The rule the literal follows is stated once, in
      # the header; `CI_IMAGE` in the workflow `env` is the summary's copy of the same string.
      image: registry.docker.manu343726.com/homelab/cppgo-ci:3610540
      credentials:
        username: ${{ secrets.REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - name: Checkout
        # `actions/checkout` is a JavaScript action (`node dist/index.js`) and this image carries
        # no Node.js: the runner executed it and died with `exec: "node": executable file not
        # found in $PATH` (run #677, job `test`, 2026-11-08, 6 s). Rather than add a runtime to
        # the image that the suite does not use, the clone is done with the image's own git.
        #
        # `GITHUB_REF` is the ref under test — `refs/pull/16/head` for a pull request,
        # `refs/heads/<branch>` for a push — so this fetches the same tree `actions/checkout`
        # would. The job token reaches git through a credential helper and never through a URL,
        # because git prints a failing URL, and a printed token is a leaked token.
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -c credential.helper='!f() { echo username=x-access-token; echo "password=${TOKEN}"; }; f' \
            fetch --depth=1 origin "${GITHUB_REF}"
          git checkout -q --detach FETCH_HEAD
          git --no-pager log --oneline -1

      - name: Fetch the newest released Go and compile the module with it
        run: |
          set -euo pipefail
          version="$(curl -fsSL 'https://go.dev/VERSION?m=text' | head -n 1)"
          platform="$(go env GOOS)-$(go env GOARCH)"
          echo "latest Go: ${version} (${platform})"
          curl -fsSL "https://go.dev/dl/${version}.${platform}.tar.gz" -o /tmp/go-latest.tar.gz
          mkdir -p /tmp/go-latest
          tar -xzf /tmp/go-latest.tar.gz -C /tmp/go-latest --strip-components=1
          /tmp/go-latest/bin/go version
          CGO_ENABLED=0 /tmp/go-latest/bin/go build ./...
          CGO_ENABLED=0 /tmp/go-latest/bin/go vet ./...
