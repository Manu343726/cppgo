name: Pages

# Builds the Hugo site in site/ and deploys it to GitHub Pages.
#
# GitHub Pages cannot be enabled by this workflow: creating the Pages site needs
# a token with administration rights, and GITHUB_TOKEN only carries the
# `pages: write` permission, so the API answers "Resource not accessible by
# integration". Until Pages is enabled once, the job builds and skips the
# deploy with a notice instead of failing.
#
# One-time setup, if the notice appears:
#   Repository -> Settings -> Pages -> Build and deployment -> Source: GitHub Actions

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Pinned explicitly. hugo_extended_0.169.0_linux-amd64.deb is published at
  # https://github.com/gohugoio/hugo/releases/tag/v0.169.0
  HUGO_VERSION: '0.169.0'

jobs:
  build:
    name: build site
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.pages_state.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Is Pages enabled?
        id: pages_state
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=GitHub Pages is not enabled::Enable it once at Settings -> Pages -> Source: GitHub Actions. The site builds fine; only the deploy is skipped."
          fi

      - name: Verify the site sources exist
        run: |
          if [ ! -f site/hugo.toml ]; then
            echo "::error file=site/hugo.toml::site/hugo.toml is missing - cannot build the site."
            exit 1
          fi

      - name: Install Hugo extended ${{ env.HUGO_VERSION }}
        run: |
          deb="hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          url="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${deb}"
          curl -fsSL --retry 3 --retry-delay 2 -o "/tmp/${deb}" "$url"
          sudo dpkg -i "/tmp/${deb}"
          hugo version
          if ! hugo version | grep -qi extended; then
            echo "::error::expected the extended Hugo build, got: $(hugo version)"
            exit 1
          fi

      # The build runs whether or not Pages is enabled: it is the check that the
      # documentation still compiles.
      - name: Build with Hugo
        run: hugo --source site --gc --minify --destination "${GITHUB_WORKSPACE}/site/public"

      - name: Configure Pages
        if: steps.pages_state.outputs.enabled == 'true'
        id: pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.pages_state.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site/public

  deploy:
    name: deploy
    needs: build
    if: needs.build.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
