name: Pages

# Builds the Hugo site in site/ and deploys it to GitHub Pages.
# The extended Hugo build is installed from a pinned release — never the
# runner's preinstalled binary, which may be neither extended nor current.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Pinned explicitly. hugo_extended_0.169.0_linux-amd64.deb is published at
  # https://github.com/gohugoio/hugo/releases/tag/v0.169.0
  HUGO_VERSION: '0.169.0'

jobs:
  build:
    name: build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify the site sources exist
        run: |
          if [ ! -f site/hugo.toml ]; then
            echo "::error file=site/hugo.toml::site/hugo.toml is missing — cannot build the site."
            echo "The Pages workflow requires a Hugo config at site/hugo.toml."
            ls -la site 2>/dev/null || echo "site/ does not exist at all."
            exit 1
          fi

      - name: Install Hugo extended ${{ env.HUGO_VERSION }}
        run: |
          deb="hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          url="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${deb}"
          curl -fsSL --retry 3 --retry-delay 2 -o "/tmp/${deb}" "$url"
          sudo dpkg -i "/tmp/${deb}"
          hugo version
          if ! hugo version | grep -qi extended; then
            echo "::error::expected the extended Hugo build, got: $(hugo version)"
            exit 1
          fi

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Hugo
        run: |
          hugo \
            --source site \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/" \
            --destination "${GITHUB_WORKSPACE}/site/public"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site/public

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
