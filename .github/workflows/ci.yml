name: CI

# Runs the suite inside the project's pinned image, ghcr.io/manu343726/cppgo-ci,
# instead of on ubuntu-latest.
#
# Why: the runner used to supply the toolchain, and when its image stopped
# shipping libclang, internal/cxx silently skipped itself and the 99% coverage
# gate failed for a reason that had nothing to do with the code. The image pins
# Go, g++ 14, clang/libclang 22, golangci-lint, hugo and cmake (see Dockerfile),
# so the environment is a reviewed artefact rather than whatever the runner has
# today.
#
# A single Go version is tested on purpose: bumping Go is a Dockerfile ARG
# change, reviewed like any other dependency. The second job keeps an eye on
# newer Go releases by checking that the library still compiles with them.
#
# WHICH IMAGE, AND WHY IT IS NOT `latest`. `container.image` cannot be computed
# from a step, so the image is resolved by a job of its own: `image` hashes the
# Dockerfile — the recipe's content address, `recipe-<first 12 hex of
# sha256(Dockerfile)>` — and waits until `.github/workflows/image.yml` has published
# that tag, then hands the ref to `test` through `needs`. A push to `main` that
# changes the Dockerfile starts both workflows in the same second; without that wait
# the gate could pull the *previous* recipe and fail for the image's age instead of
# for the code. A pull request cannot publish, so there the tag is checked once and
# the run says plainly that a Dockerfile change is only testable after it lands on
# `main`.
#
# That tag is the same one the Forgejo workflow runs in
# (`registry.docker.manu343726.com/homelab/cppgo-ci:recipe-…`): two registries, one
# address, one recipe. When the gate is red in one forge it is red in the other for
# a reason in the tree, not in the environment.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'site/**'
      - '**/*.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # The image is a private GHCR package; the job authenticates with the
  # workflow token to pull it.
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/manu343726/cppgo-ci
  COVERAGE_THRESHOLD: '99.0'
  # A skipped introspection test is a lie in CI: it silently drops most of
  # internal/cxx from the coverage profile and the gate then fails with a
  # number nobody can explain. Require libclang instead of skipping.
  CPPGO_REQUIRE_LIBCLANG: '1'

jobs:
  image:
    name: image
    runs-on: ubuntu-latest
    # The wait is bounded at 60 minutes below; this keeps a stuck job from holding a
    # runner for the six hours GitHub allows.
    timeout-minutes: 75
    outputs:
      # `container.image` accepts the `needs` context (GitHub's context-table row for
      # `jobs.<job_id>.container.image`), which is what lets a step's answer choose the
      # container a later job runs in.
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve the recipe image, and wait for it when this push publishes it
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The same string `.github/workflows/image.yml` publishes. One recipe, one
          # address; if the two ever disagree the wait below times out instead of running
          # the gate in a different environment.
          tag="recipe-$(sha256sum Dockerfile | cut -c1-12)"
          case "${tag}" in
            recipe-[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            *) echo "::error::cannot compute the recipe tag from ./Dockerfile (got '${tag}')" >&2; exit 1 ;;
          esac
          ref="${IMAGE}:${tag}"
          echo "ref=${ref}" >>"${GITHUB_OUTPUT}"
          echo "the recipe of this tree is ${ref}"

          printf '%s' "${GH_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

          # A push to main that changes the Dockerfile starts image.yml at the same time
          # as this run: wait for it (30 s x 120). Nothing can publish from a pull
          # request, so there the check is once and the failure names the reason.
          attempts=120
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then attempts=1; fi

          i=1
          while [ "${i}" -le "${attempts}" ]; do
            if docker manifest inspect "${ref}" >/dev/null 2>&1; then
              echo "${ref} is published (attempt ${i}/${attempts})"
              exit 0
            fi
            echo "attempt ${i}/${attempts}: ${ref} is not in GHCR yet"
            i=$((i + 1))
            if [ "${i}" -le "${attempts}" ]; then sleep 30; fi
          done

          echo "::error::${ref} is not published. .github/workflows/image.yml publishes it on a push to main that changes the Dockerfile, so a Dockerfile change is only testable after it lands on main." >&2
          exit 1

  test:
    name: test
    needs: image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show the pinned toolchain
        run: |
          go version
          g++ --version | head -n 1
          clang --version | head -n 1
          cmake --version | head -n 1
          golangci-lint --version
          hugo version

      - name: Build without cgo (the no-cgo contract)
        run: CGO_ENABLED=0 go build ./...

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        run: golangci-lint run --timeout=8m

      - name: Test without cgo (proves the library needs no cgo)
        run: CGO_ENABLED=0 go test -count=1 ./...

      - name: Test (race + atomic coverage)
        run: |
          go test -race -count=1 -covermode=atomic \
            -coverprofile=coverage.out ./...

      - name: Coverage gate (>= 99%)
        run: ./scripts/coverage-gate.sh coverage.out "${COVERAGE_THRESHOLD}"

      - name: Build the examples
        run: ./scripts/build-examples.sh

      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: warn
          retention-days: 14

  targets:
    name: targets
    # The three compatibility targets' real headers, plus #42's example modules for them.
    #
    # `internal/gen/targets_smoke_test.go` (`-tags cppgo_targets`) parses Eigen 3.4, OpenCV 4.10
    # and ArrayFire 3.10 CPU out of the pinned image and reports, per library, what the parse
    # found and what the curated subset bound. It reads one include root, while the image keeps
    # the three under two — `/usr/include/eigen3`, `/usr/include/opencv4` and
    # `/usr/local/include/af` — so the step merges them into `/tmp/targets`. The merge is
    # load-bearing: without it ArrayFire is not found and the smoke skips it, and a skip is not
    # evidence.
    #
    # The smoke does not fail on a construct the emitter cannot carry (reporting that is its
    # job), so the job counts the run's `parsed` lines and fails unless all three libraries were
    # parsed. The run says which libraries it exercised in its summary and uploads the log.
    #
    # `scripts/test-targets.sh` runs the test target of `examples/opencv`, `examples/arrayfire`
    # and `examples/eigen` once #42 lands them, and names the ones still absent. It is decoupled
    # from their landing on purpose: this job is green before they exist.
    #
    # It needs the image `test` waits for, so it takes the ref from `needs.image` and never
    # builds one of its own.
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Target headers (Eigen, OpenCV, ArrayFire)
        run: |
          set -euo pipefail
          mkdir -p /tmp/targets
          ln -sfn /usr/include/eigen3 /usr/include/opencv4 /usr/local/include/af /tmp/targets/
          CPPGO_TARGETS_INCLUDE=/tmp/targets \
            go test -tags cppgo_targets ./internal/gen -run TestTargetHeadersSmoke -v \
            | tee /tmp/targets-smoke.log

          # One `parsed <header>: ...` line per library the smoke read. Count them and refuse to
          # be green on a skip: the image carries all three, so a missing line means that
          # library's evidence was not produced.
          echo
          echo "libraries parsed by the smoke:"
          grep -oE '(eigen|opencv|arrayfire): parsed ' /tmp/targets-smoke.log | sed 's/: parsed //' | sort -u || true
          parsed="$(grep -cE '(eigen|opencv|arrayfire): parsed ' /tmp/targets-smoke.log || true)"
          if [[ ${parsed} -ne 3 ]]; then
            echo "::error::the target smoke parsed ${parsed}/3 libraries; a skip is not evidence" >&2
            exit 1
          fi

      - name: Target example modules (when they exist)
        run: |
          set -euo pipefail
          ./scripts/test-targets.sh | tee /tmp/targets-examples.log

      - name: The run's report
        if: always()
        continue-on-error: true
        run: |
          {
            echo "## cppgo — targets"
            echo
            echo "- image: \`${{ needs.image.outputs.ref }}\`"
            echo "- commit: \`$(git rev-parse HEAD)\`"
            if [ -s /tmp/targets-smoke.log ]; then
              libs="$(grep -oE '(eigen|opencv|arrayfire): parsed ' /tmp/targets-smoke.log | sed 's/: parsed //' | sort -u | tr '\n' ' ')"
              echo "- libraries parsed: ${libs:-none}"
            else
              echo "- libraries parsed: the smoke did not run"
            fi
            if [ -s /tmp/targets-examples.log ]; then
              echo "- example modules: $(grep '^targets:' /tmp/targets-examples.log | tail -n 1)"
            else
              echo "- example modules: the script did not run"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the target smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: targets-smoke
          path: |
            /tmp/targets-smoke.log
            /tmp/targets-examples.log
          if-no-files-found: warn
          retention-days: 14

  build-latest-go:
    name: build with the latest Go
    # Forward-compatibility smoke test only: no coverage, no libclang. It answers
    # one question — does the library still compile with a Go newer than the one
    # the image pins? — so a toolchain bump is never a surprise.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go (latest)
        uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true

      - name: Build without cgo
        run: CGO_ENABLED=0 go build ./...

      - name: Vet
        run: CGO_ENABLED=0 go vet ./...
