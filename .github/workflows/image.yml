name: Image

# Builds and publishes the pinned CI toolchain image, from this repository's
# `Dockerfile` and nothing else:
#
#   ghcr.io/manu343726/cppgo-ci:recipe-<first 12 hex of sha256(Dockerfile)>
#   ghcr.io/manu343726/cppgo-ci:latest
#   ghcr.io/manu343726/cppgo-ci:sha-<12 chars of the commit>
#
# `recipe-…` is the address `ci.yml` runs in, and the same address names the image
# on Harbor for the Forgejo workflow: two registries, one address, one recipe. It is
# content-addressed on purpose — it can be computed from the file before the commit
# that changes it exists, so a Dockerfile change and the workflow that consumes it
# land in one commit, and rebuilding the same bytes keeps the same address instead of
# inventing a second one. `latest` is for humans and no workflow runs in it; `sha-…`
# is history.
# The image exists so CI stops depending on what ubuntu-latest happens to ship
# that week (it dropped libclang once, internal/cxx skipped itself and the 99%
# coverage gate failed for an environmental reason). ci.yml is switched onto
# this image separately; this workflow only builds and publishes it.
#
# Everything the image contains is downloaded inside the build from versions
# pinned as ARGs in the Dockerfile, so the build is reproducible and the only
# input is the Dockerfile itself. Hence the narrow path filter: a change to the
# repo's Go code does not rebuild the toolchain.

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/manu343726/cppgo-ci

jobs:
  publish:
    name: build and push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Short SHA
        id: sha
        run: echo "short=$(git rev-parse --short=12 HEAD)" >>"$GITHUB_OUTPUT"

      - name: Recipe tag
        # The recipe's content address. Not the commit's sha: that one only exists after
        # the commit is made, which would force a second commit to point `ci.yml` at the
        # image its own tree produces. `ci.yml`'s `image` job computes the same string from
        # the same file; the two must stay identical, and each says so.
        id: recipe
        run: |
          set -euo pipefail
          tag="recipe-$(sha256sum Dockerfile | cut -c1-12)"
          case "${tag}" in
            recipe-[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            *) echo "::error::cannot compute the recipe tag from ./Dockerfile (got '${tag}')" >&2; exit 1 ;;
          esac
          echo "tag=${tag}" >>"${GITHUB_OUTPUT}"
          echo "recipe tag: ${tag}"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # CI runs on linux/amd64 runners, so only that platform is published: an
      # arm64 manifest would double the build time and buy nothing. The
      # Dockerfile maps the architecture itself and would build for arm64
      # unchanged if that ever becomes useful.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.recipe.outputs.tag }}
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ steps.sha.outputs.short }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=cppgo-ci
          cache-from: type=gha,scope=cppgo-ci
          cache-to: type=gha,mode=max,scope=cppgo-ci

      - name: Report the published manifests
        run: |
          docker buildx imagetools inspect "$IMAGE:${{ steps.recipe.outputs.tag }}"
          docker buildx imagetools inspect "$IMAGE:sha-${{ steps.sha.outputs.short }}"
